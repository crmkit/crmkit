{{/*
  Branded transactional emails, embedded into the binary and rendered with
  html/template. Edit this file as normal HTML. Email clients (notably Gmail)
  strip <style> blocks and inline SVG, so styles are inline and the logo is a
  hosted PNG. "header" and "footer" are the shared card layout; "login",
  "escalation" and "invite" are the message bodies. All dynamic values are
  auto-escaped.
*/}}
{{define "header"}}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;padding:0;background:#fafafa;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fafafa;padding:32px 12px;"><tr><td align="center">
<table role="presentation" cellpadding="0" cellspacing="0" style="width:460px;max-width:460px;background:#ffffff;border:1px solid #ececec;border-radius:14px;"><tr><td style="padding:34px 38px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111111;">
<div style="text-align:center;margin-bottom:26px;"><img src="https://crmkit.ai/icon-light.png" width="44" height="44" alt="crmkit" style="border:0;outline:none;text-decoration:none;display:inline-block;" />
<div style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;letter-spacing:3px;color:#111111;margin-top:6px;">crmkit</div></div>
<h1 style="font-size:18px;font-weight:600;margin:0 0 14px;color:#111111;">{{.Heading}}</h1>{{end}}

{{define "footer"}}<div style="margin-top:30px;padding-top:16px;border-top:1px solid #ececec;font-size:12px;line-height:1.5;color:#9a9a9a;">You're receiving this because someone used this address with crmkit. If it wasn't you, you can safely ignore this email.</div>
</td></tr></table></td></tr></table></body></html>{{end}}

{{/* code: a large, letter-spaced one-time code block. */}}
{{define "code"}}<div style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:8px;text-align:center;background:#f5f5f5;border-radius:10px;padding:18px 0;margin:10px 0;color:#111111;">{{.Code}}</div>{{end}}

{{define "login"}}{{template "header" .}}
<p style="font-size:14px;line-height:1.6;color:#444444;margin:0 0 14px;">Enter this code to sign in:</p>
{{template "code" .}}
<p style="font-size:13px;color:#777777;margin:8px 0 0;">Expires in {{.TTLMinutes}} minutes.</p>
{{template "footer" .}}{{end}}

{{define "escalation"}}{{template "header" .}}
<p style="font-size:14px;line-height:1.6;color:#444444;margin:0 0 14px;">To <strong>{{.Action}}</strong>, use this code:</p>
{{template "code" .}}
<p style="font-size:13px;color:#777777;margin:8px 0 0;">Expires in {{.TTLMinutes}} minutes. If you did not request this, ignore this email.</p>
{{template "footer" .}}{{end}}

{{define "invite"}}{{template "header" .}}
<p style="font-size:14px;line-height:1.6;color:#444444;margin:0 0 14px;">You've been invited to collaborate in a crmkit workspace.</p>
<p style="font-size:14px;line-height:1.6;color:#444444;margin:0 0 14px;">To accept, sign in using <strong>this email address</strong> ({{.To}}) - you'll join the workspace automatically.</p>
<div style="margin:6px 0 4px;"><a href="{{.BaseURL}}" style="display:inline-block;background:#111111;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 24px;border-radius:9px;">Sign in to crmkit</a></div>
<p style="font-size:12px;color:#9a9a9a;margin:16px 0 0;word-break:break-all;">{{.BaseURL}}</p>
{{template "footer" .}}{{end}}
