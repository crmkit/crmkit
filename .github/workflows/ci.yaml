name: CI

on:
  push:
    branches:
      - main
      - next
    tags-ignore:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'configs/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - next
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'configs/**'

permissions:
  contents: read

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest

    # Service containers so the env-gated Postgres and Redis integration tests
    # run on every push/PR (they t.Skip when the DSNs below are unset).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crmkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test
        env:
          CRMKIT_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/crmkit?sslmode=disable
          CRMKIT_TEST_REDIS_URL: redis://localhost:6379/0
        run: go test ./... -count=1 -race

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath ./cmd/crmkitd

  cross-compile:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          for cmd in crmkitd; do
            go build -trimpath -o "${cmd}${EXT}" "./cmd/${cmd}"
          done
